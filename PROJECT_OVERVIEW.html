<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Элитарный Клуб - Мастер-описание проекта</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@400;500;700&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0c10;
      --panel-bg: #12161f;
      --card-bg: #181e2b;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --gold-dark: #aa820a;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: rgba(212, 175, 55, 0.35);
      --red: #ef4444;
      --green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
        linear-gradient(to bottom, #07090c, #0d1117);
    }
    
    #lock-screen {
      background: var(--panel-bg);
      border: 1.5px solid var(--gold);
      border-radius: 12px;
      padding: 40px 32px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(212,175,55,0.2);
    }
    .owl-icon {
      font-size: 54px;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 10px rgba(212,175,55,0.6));
    }
    .lock-title {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      color: var(--gold-light);
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }
    .lock-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .input-group {
      position: relative;
      margin-bottom: 20px;
    }
    input[type="password"] {
      width: 100%;
      background: #080a0e;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      color: #fff;
      font-size: 18px;
      font-family: 'Roboto Mono', monospace;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
      transition: all 0.3s;
    }
    input[type="password"]:focus {
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(212,175,55,0.4);
    }
    .btn-unlock {
      width: 100%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #000;
      font-weight: 700;
      font-size: 15px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(212,175,55,0.3);
      transition: all 0.2s;
    }
    .btn-unlock:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212,175,55,0.5);
    }
    .btn-unlock:active {
      transform: translateY(0);
    }
    .error-msg {
      color: var(--red);
      font-size: 13px;
      margin-top: 14px;
      min-height: 20px;
      font-weight: 500;
    }

    #content-screen {
      display: none;
      width: 100%;
      max-width: 960px;
      padding: 40px 24px 80px;
    }
    .doc-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }
    h1 {
      font-family: 'Cinzel', serif;
      color: var(--gold-light);
      font-size: 30px;
      margin-bottom: 8px;
      border-bottom: 2px solid var(--gold);
      padding-bottom: 16px;
      letter-spacing: 1px;
    }
    h2 {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      font-size: 22px;
      margin-top: 36px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(212,175,55,0.2);
      padding-bottom: 8px;
    }
    h3 {
      color: var(--gold-light);
      font-size: 16px;
      margin-bottom: 20px;
      font-weight: 400;
    }
    p, li {
      color: #cbd5e1;
      font-size: 15px;
      line-height: 1.7;
    }
    ul, ol {
      margin-left: 20px;
      margin-bottom: 16px;
    }
    li {
      margin-bottom: 8px;
    }
    strong {
      color: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 24px 0;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border: 1px solid rgba(212,175,55,0.15);
      font-size: 14px;
    }
    th {
      background: rgba(212,175,55,0.15);
      color: var(--gold-light);
      font-family: 'Cinzel', serif;
      font-weight: 700;
    }
    code {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(212,175,55,0.2);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Roboto Mono', monospace;
      color: var(--gold-light);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div id="lock-screen">
    <div class="owl-icon">🦉</div>
    <h1 class="lock-title">Элитарный Клуб</h1>
    <div class="lock-subtitle">Доступ ограничен • Введите пароль</div>
    <div class="input-group">
      <input type="password" id="passInput" placeholder="•••••••" autofocus />
    </div>
    <button class="btn-unlock" id="btnUnlock">Войти в Клуб</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div id="content-screen">
    <div class="doc-card" id="docTarget"></div>
  </div>

    function hexToBuf(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) {
        bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
      }

    async function decryptDoc(password) {
      const enc = new TextEncoder();
      const keyMaterial = await window.crypto.subtle.importKey(
        'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
      );
      const key = await window.crypto.subtle.deriveKey(

        { name: 'AES-GCM', length: 256 },

        { name: 'AES-GCM', iv: hexToBuf(IV), tagLength: 128 },
        key,
